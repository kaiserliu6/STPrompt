default: &default
  backbone: stf4
  optimizer: adamW
  batch_size: 128
  epoch: 200
  early_stop: 20
  dropout: 0.0
  loss: mae
  gtg:
    loss: mse
  gcn:
    in_channel: 12
    out_channel: 12
    hidden_channel: 64
  kernel_size: 3
  dilation: 1
  emb_dim: 64
  t_layer: 2
  s_layer: 2
  t_head: 2
  s_head: 4
  need_graph: True
  ste:
    need_time: True

